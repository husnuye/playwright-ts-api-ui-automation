name: UI Tests (Playwright)

on:
  push:
    paths:
      - "WebTests/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "WebTests/**"
      - ".github/workflows/web-tests.yml"

# We deploy the Playwright HTML report to the `gh-pages` branch.
# That requires write permission on repository contents.
permissions:
  contents: write

jobs:
  web-tests:
    runs-on: ubuntu-latest

    # Keep the job scoped to WebTests so commands stay simple and consistent.
    defaults:
      run:
        working-directory: WebTests

    steps:
      # 1) Checkout repository at the commit being tested.
      - uses: actions/checkout@v4

      # 2) Setup Node + npm caching for faster CI runs.
      # Cache is keyed by the lockfile of this suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebTests/package-lock.json

      # 3) Install dependencies exactly from package-lock (reproducible builds).
      - name: Install dependencies
        run: npm ci

      # 4) Install Playwright browsers + system deps (Chromium only for speed).
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # 5) Run UI tests with explicit env vars so PRs are predictable.
      - name: Run UI tests
        env:
          SAUCE_BASE_URL: https://www.saucedemo.com
          SAUCE_STANDARD_USER: standard_user
          SAUCE_VISUAL_USER: visual_user
          SAUCE_PASSWORD: secret_sauce
        run: npm test

      # 6) Always upload artifacts (even on failure) for debugging:
      # - playwright-report: HTML report
      # - test-results: traces/screenshots/videos (raw)
      - name: Upload Playwright artifacts (report + test-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          retention-days: 7
          path: |
            WebTests/playwright-report
            WebTests/test-results

      # 7) Publish the HTML report to GitHub Pages (gh-pages branch).
      # URL: https://<user>.github.io/<repo>/webtests/
      - name: Deploy Playwright report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: WebTests/playwright-report
          destination_dir: webtests
          keep_files: true