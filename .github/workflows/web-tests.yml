name: UI Tests (Playwright)

on:
  push:
    paths:
      - "WebTests/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "WebTests/**"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: write

jobs:
  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebTests

    steps:
      # 1) Checkout repository at the commit being tested
      - uses: actions/checkout@v4

      # 2) Setup Node + npm caching (faster CI)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebTests/package-lock.json

      # 3) Install dependencies from lockfile (reproducible builds)
      - name: Install dependencies
        run: npm ci

      # 4) Install Playwright browsers + system deps
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # 5) Run UI tests with explicit env vars
      - name: Run UI tests
        env:
          SAUCE_BASE_URL: https://www.saucedemo.com
          SAUCE_STANDARD_USER: standard_user
          SAUCE_VISUAL_USER: visual_user
          SAUCE_PASSWORD: secret_sauce
        run: npm test

      # 6) Upload artifacts even on failure (debugging)
      - name: Upload Playwright artifacts (report + test-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          retention-days: 7
          path: |
            WebTests/playwright-report
            WebTests/test-results

      # 7) Deploy HTML report to GitHub Pages (only on main branch)
      - name: Deploy Playwright report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: webtests
          publish_dir: WebTests/playwright-report
          keep_files: true