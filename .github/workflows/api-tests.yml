name: API Tests (Playwright)

on:
  push:
    paths:
      - "ApiTests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "ApiTests/**"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiTests

    steps:
      # 1) Checkout repository at the commit being tested
      - uses: actions/checkout@v4

      # 2) Setup Node + npm caching (faster CI)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ApiTests/package-lock.json

      # 3) Install dependencies from lockfile (reproducible builds)
      - name: Install dependencies
        run: npm ci

      # 4) Install Playwright browsers + system deps
      # Even for API tests, Playwright runner/reporting is shared.
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      # 5) Run API tests with explicit env vars
      - name: Run API tests
        env:
          BOOKER_BASE_URL: https://restful-booker.herokuapp.com
          BOOKER_USERNAME: admin
          BOOKER_PASSWORD: password123
        run: npm test

      # 6) Upload artifacts even on failure (debugging)
      - name: Upload Playwright artifacts (report + test-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          retention-days: 7
          path: |
            ApiTests/playwright-report
            ApiTests/test-results

      # 7) Deploy HTML report to GitHub Pages (only on main branch)
      # This avoids PR branches overwriting the public Pages site.
      - name: Deploy Playwright report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: apitests
          publish_dir: ApiTests/playwright-report
          keep_files: true