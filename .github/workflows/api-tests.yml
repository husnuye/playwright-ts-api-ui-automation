name: API Tests (Playwright)

on:
  push:
    paths:
      - "ApiTests/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "ApiTests/**"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiTests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ApiTests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        env:
          BOOKER_BASE_URL: https://restful-booker.herokuapp.com
          BOOKER_USERNAME: admin
          BOOKER_PASSWORD: password123
        run: npm test

      - name: Upload Playwright artifacts (report + test-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          retention-days: 7
          path: |
            ApiTests/playwright-report
            ApiTests/test-results

      # Deploy ONLY from main so PR branches don’t overwrite Pages
      - name: Deploy Playwright report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: apitests
          publish_dir: ApiTests/playwright-report
          keep_files: true